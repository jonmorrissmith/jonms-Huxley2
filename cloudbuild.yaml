# cloudbuild.yaml
steps:
  # Build the .NET application using the .NET SDK container
  - name: 'mcr.microsoft.com/dotnet/sdk:8.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        dotnet build --configuration Release
        dotnet test **/*Tests/*.csproj --configuration Release --collect:"XPlat Code Coverage" || true
        dotnet publish **/Huxley2.csproj --configuration Release --output /workspace/publish

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/huxley2:$COMMIT_SHA', '-f', 'Dockerfile', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/huxley2:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'huxley2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/huxley2:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/huxley2:$COMMIT_SHA'

# Configure timeout
timeout: 1800s

# Logging options
options:
  logging: CLOUD_LOGGING_ONLY
